<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>回忆 · 生日小站</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ============ 聊天记录风格 ============ */
    .chat-shell {
      max-width: 560px;
      margin: 0 auto;
      border: 2px solid var(--frame);
      box-shadow: 6px 6px 0 rgba(31, 19, 12, 0.55);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 244, 227, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      background: linear-gradient(90deg, rgba(61,31,14,0.35), rgba(164,85,46,0.3), rgba(61,31,14,0.35));
      background-size: 200% 100%;
      animation: flowBg 12s ease-in-out infinite;
      border-bottom: 2px solid var(--frame);
      color: var(--cream);
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(31,19,12,0.5);
    }

    .chat-body {
      padding: 20px 16px 24px;
      max-height: 62vh;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .msg { display: flex; gap: 9px; margin-bottom: 15px; align-items: flex-start; }
    .msg.right { flex-direction: row-reverse; }

    .avatar {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 2px solid var(--frame);
      background: linear-gradient(135deg, #ffd9a8, #ff9f6e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg.me .avatar { background: linear-gradient(135deg, #ffe9b8, #e8952c); }

    .bubble {
      max-width: 68%;
      padding: 9px 13px;
      border-radius: 4px 14px 14px 14px;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--frame);
      box-shadow: 2px 2px 0 rgba(31, 19, 12, 0.5);
      color: var(--ink);
      font-size: 0.98rem;
      line-height: 1.55;
      word-break: break-word;
      position: relative;
    }
    .msg.right .bubble { border-radius: 14px 4px 14px 14px; background: #ffe9b8; }

    /* 大表情消息：无气泡底 */
    .bubble.emoji-only {
      background: none;
      border: none;
      box-shadow: none;
      font-size: 2.3rem;
      padding: 2px 6px;
      line-height: 1.2;
    }

    /* 文字 + 附带小表情 */
    .bubble .emo { font-size: 1.15em; }

    /* 表情包贴图（如「无力」那种图） */
    .bubble.sticker {
      background: rgba(255, 255, 255, 0.92);
      font-weight: 800;
      font-size: 1.05rem;
      text-align: center;
      padding: 14px 18px;
    }
    .bubble.sticker .stk-icon { font-size: 1.9rem; display: block; margin-bottom: 4px; }

    .msg.me .bubble { box-shadow: 2px 2px 0 rgba(31, 19, 12, 0.5); }

    /* 图片消息 */
    .bubble.img-msg { padding: 4px; }
    .bubble.img-msg img { max-width: 180px; border-radius: 8px; display: block; }

    .chat-foot {
      text-align: center;
      font-size: 0.82rem;
      color: #a0784f;
      padding: 10px;
      border-top: 2px dashed rgba(31, 19, 12, 0.35);
      background: rgba(255, 248, 238, 0.5);
    }

    /* ============ 游戏搭子档案卡 ============ */
    .game-card {
      max-width: 560px;
      margin: 70px auto 0;
      border: 2px solid var(--frame);
      box-shadow: 6px 6px 0 rgba(31, 19, 12, 0.55);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 244, 227, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .game-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 2px solid var(--frame);
      background: linear-gradient(90deg, rgba(61,31,14,0.35), rgba(164,85,46,0.3), rgba(61,31,14,0.35));
      background-size: 200% 100%;
      animation: flowBg 12s ease-in-out infinite;
    }
    .game-head .g-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid var(--frame);
      background: linear-gradient(135deg, #ffc3a0, #e05c3a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .game-head .g-name { color: var(--cream); font-weight: 900; font-size: 1.1rem; text-shadow: 0 1px 4px rgba(31,19,12,0.5); }
    .game-head .g-id { color: rgba(255,244,227,0.8); font-size: 0.78rem; }
    .game-head .g-rank {
      margin-left: auto;
      background: linear-gradient(135deg, #cd7f32, #e8a02c);
      border: 2px solid var(--frame);
      border-radius: 999px;
      padding: 5px 12px;
      color: #fff;
      font-weight: 800;
      font-size: 0.8rem;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    .game-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(31,19,12,0.25); }
    .game-stats .stat { background: rgba(255, 248, 238, 0.75); text-align: center; padding: 12px 4px; }
    .game-stats .v { font-weight: 900; font-size: 1.05rem; color: var(--pink-deep); }
    .game-stats .k { font-size: 0.72rem; color: #a0784f; margin-top: 2px; }
    .game-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: rgba(255, 248, 238, 0.55);
      border-top: 1px dashed rgba(31,19,12,0.35);
      font-size: 0.92rem;
      color: var(--ink);
    }
    .game-recent { border-top: 2px solid var(--frame); }
    .game-recent .gr-title { font-size: 0.8rem; font-weight: 800; color: #a0784f; padding: 8px 14px 4px; letter-spacing: 1px; }
    .gr-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      font-size: 0.88rem;
      color: var(--ink);
      border-top: 1px dashed rgba(31,19,12,0.2);
    }
    .gr-row .badge {
      min-width: 34px;
      text-align: center;
      border: 2px solid var(--frame);
      border-radius: 8px;
      font-weight: 900;
      padding: 1px 0;
      font-size: 0.82rem;
    }
    .gr-row .badge.win { background: #7ac74f; color: #fff; }
    .gr-row .badge.lose { background: #e8635a; color: #fff; }
    .gr-row .gr-map { font-weight: 700; }
    .gr-row .gr-score { color: #a0784f; }
    .gr-row .gr-time { margin-left: auto; color: #b8967a; font-size: 0.78rem; }
    .game-quote {
      padding: 12px 16px;
      border-top: 2px solid var(--frame);
      background: linear-gradient(135deg, rgba(255, 215, 110, 0.35), rgba(255, 178, 107, 0.35));
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: center;
    }

    /* 求和实锤照片 */
    .game-photo {
      border-top: 2px solid var(--frame);
      padding: 14px;
      background: rgba(255, 248, 238, 0.55);
      text-align: center;
    }
    .game-photo .gp-title { font-size: 0.8rem; font-weight: 800; color: #a0784f; letter-spacing: 1px; margin-bottom: 10px; }
    .game-photo figure { margin: 0; cursor: zoom-in; display: inline-block; position: relative; }
    .game-photo img {
      max-width: 100%;
      width: 300px;
      border: 2px solid var(--frame);
      box-shadow: 4px 4px 0 rgba(31, 19, 12, 0.55);
      border-radius: 12px;
      display: block;
      transition: transform 0.25s;
    }
    .game-photo figure:hover img { transform: translateY(-4px) rotate(-1deg); }
    .game-photo figcaption { font-size: 0.8rem; color: #a0784f; margin-top: 8px; }

    /* 输入框装饰条 */
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 2px solid var(--frame);
      background: rgba(255, 248, 238, 0.65);
    }
    .chat-input-bar .fake-input {
      flex: 1;
      border: 2px solid var(--frame);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      color: #b8967a;
      background: rgba(255,255,255,0.8);
    }
    .chat-input-bar .fake-btn {
      border: 2px solid var(--frame);
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold), var(--pink));
      color: var(--ink);
      cursor: pointer;
    }

    /* 时间线区块沿用原有样式，仅调间距 */
    .section-label { margin-top: 70px; }
  </style>
</head>
<body data-title="回忆">
  <main>
    <h1 class="glitter" style="font-size: clamp(1.8rem, 5vw, 2.6rem);">💌 这一年，收录了你的表情包</h1>
    <p class="subtitle">每一句「嘻嘻」和「逆天」，都是可爱本身</p>

    <!-- 聊天记录 -->
    <div class="chat-shell flow-reveal">
      <div class="chat-head">💭 和李梨的聊天日常（精选）</div>
      <div class="chat-body" id="chat-body"></div>
      <div class="chat-input-bar">
        <div class="fake-input">想 TA 的时候，就来看看这段聊天…</div>
        <button class="fake-btn" id="replay-btn" title="从头再放一遍">↻ 重放</button>
      </div>
      <div class="chat-foot">聊天记录共 <b id="msg-count"></b> 条 · 持续更新中…</div>
    </div>

    <!-- 游戏搭子档案 -->
    <div class="game-card flow-reveal" id="game-card">
      <div class="game-head">
        <div class="g-avatar">🎮</div>
        <div>
          <div class="g-name" id="g-nick"></div>
          <div class="g-id" id="g-id"></div>
        </div>
        <div class="g-rank" id="g-rank"></div>
      </div>
      <div class="game-stats" id="g-stats"></div>
      <div class="game-main" id="g-main"></div>
      <div class="game-recent">
        <div class="gr-title">📋 最近战绩</div>
        <div id="g-recent"></div>
      </div>
      <div class="game-photo" id="g-photo-block">
        <div class="gp-title">📸 求和实锤 · 铁证如山</div>
        <figure id="g-photo-fig">
          <img id="g-photo" src="" alt="对方请求和棋" loading="lazy" />
          <figcaption id="g-photo-cap"></figcaption>
        </figure>
      </div>
      <div class="game-quote" id="g-quote"></div>
    </div>

    <!-- 大事记时间线（保留） -->
    <div class="section-label">这一年的大事记</div>
    <div class="timeline" id="timeline"></div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    /* ---- 聊天记录渲染 ---- */
    const chatBody = document.getElementById("chat-body");
    const AVATAR_HTML = CONFIG.chatAvatar
      ? `<img src="assets/photos/${CONFIG.chatAvatar}" alt="头像" onerror="this.parentNode.textContent='${CONFIG.emojiAvatar}'" />`
      : CONFIG.emojiAvatar;
    const MY_AVATAR = "🎂";

    function bubbleHTML(m) {
      if (m.img) return `<div class="bubble img-msg"><img src="assets/photos/${m.img}" alt="图片" loading="lazy" onerror="this.remove()" /></div>`;
      if (m.sticker) return `<div class="bubble sticker"><span class="stk-icon">😤</span>${m.sticker}</div>`;
      if (m.emoji && !m.text) return `<div class="bubble emoji-only">${m.emoji}</div>`;
      return `<div class="bubble">${m.text}${m.emoji ? ` <span class="emo">${m.emoji}</span>` : ""}</div>`;
    }

    let msgs = [];
    function renderAll() {
      chatBody.innerHTML = CONFIG.chatMessages
        .map((m) => {
          const mine = m.side === "right";
          return `
          <div class="msg ${mine ? "right me" : "left"}">
            <div class="avatar">${mine ? MY_AVATAR : AVATAR_HTML}</div>
            ${bubbleHTML(m)}
          </div>`;
        })
        .join("");
      document.getElementById("msg-count").textContent = CONFIG.chatMessages.length;
    }

    /* 打字机式逐条浮现 */
    function playChat() {
      msgs = [...chatBody.children];
      msgs.forEach((el) => (el.style.display = "none"));
      let i = 0;
      const timer = setInterval(() => {
        if (i >= msgs.length) {
          clearInterval(timer);
          return;
        }
        const el = msgs[i++];
        el.style.display = "";
        el.style.animation = "pageIn 0.4s ease both";
        chatBody.scrollTop = chatBody.scrollHeight;
      }, 180);
    }

    renderAll();
    playChat();
    document.getElementById("replay-btn").addEventListener("click", playChat);

    /* ---- 游戏搭子档案 ---- */
    const GP = CONFIG.gameProfile;
    document.getElementById("g-nick").textContent = GP.nickname;
    document.getElementById("g-id").textContent = `${GP.gameId} · ${GP.uid}`;
    document.getElementById("g-rank").textContent = GP.rank;
    document.getElementById("g-stats").innerHTML = [
      [GP.level, "游戏等级"],
      [GP.hours, "游戏时长"],
      [GP.kda, "赛季 KDA"],
      [GP.winRate, "赛季胜率"],
      [GP.acs, "ACS"],
      [GP.kast, "KAST"],
      ["37.6%", "回合胜率"],
      ["11.7%", "精准击败"],
    ]
      .map(([v, k]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`)
      .join("");
    document.getElementById("g-main").innerHTML = `🔥 本命英雄：<b>${GP.mainHero}</b>（据说是隐藏高手）`;
    document.getElementById("g-recent").innerHTML = GP.recent
      .map(
        (r) => `
      <div class="gr-row">
        <div class="badge ${r.result === "胜" ? "win" : "lose"}">${r.result}</div>
        <div class="gr-map">${r.map}</div>
        <div class="gr-score">${r.score}</div>
        <div class="gr-time">${r.time}</div>
      </div>`
      )
      .join("");
    document.getElementById("g-quote").textContent = GP.quote;

    /* 求和实锤照片（有配图才显示该区块） */
    if (GP.drawPhoto) {
      const img = document.getElementById("g-photo");
      img.src = "assets/photos/" + GP.drawPhoto;
      document.getElementById("g-photo-cap").textContent = GP.drawCaption || "";
      document.getElementById("g-photo-fig").addEventListener("click", () => {
        const lb = document.createElement("div");
        lb.style.cssText = "position:fixed;inset:0;z-index:300;background:rgba(30,14,4,0.9);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;";
        const big = img.cloneNode();
        big.style.cssText = "max-width:min(88vw,500px);max-height:82vh;border-radius:12px;border:3px solid #1f130c;box-shadow:0 20px 60px rgba(0,0,0,.6);";
        lb.appendChild(big);
        lb.addEventListener("click", () => lb.remove());
        document.body.appendChild(lb);
      });
    } else {
      document.getElementById("g-photo-block").style.display = "none";
    }

    /* ---- 大事记时间线 ---- */
    const tl = document.getElementById("timeline");
    tl.innerHTML = CONFIG.timeline
      .map(
        (t) => `
      <div class="tl-item">
        <div class="tl-card">
          <div class="date">${t.date}</div>
          <h3>${t.title}</h3>
          <p>${t.text}</p>
        </div>
      </div>`
      )
      .join("");
  </script>
</body>
</html>
