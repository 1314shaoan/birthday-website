<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解锁 · 生日小站</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: linear-gradient(160deg, #2b1206, #8a4520); }
    .unlock-wrap { min-height: calc(100vh - 200px); display: flex; align-items: center; justify-content: center; }
    .lock-card { max-width: 430px; width: 100%; text-align: center; transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease; }
    .lock-card h1 { font-size: 1.7rem; color: var(--pink-deep); margin-bottom: 8px; }
    .lock-card .tip { color: #a0784f; font-size: 0.92rem; margin-bottom: 24px; }
    .field { margin-bottom: 16px; text-align: left; }
    .field label { display: block; color: var(--ink); font-size: 0.9rem; margin-bottom: 6px; font-weight: 700; }
    .field input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: rgba(255, 250, 240, 0.95);
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      transition: 0.25s;
    }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 215, 110, 0.25); }
    .field input.wrong { border-color: #e0402c; animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }
    .err-msg { color: #ffb4a6; font-size: 0.85rem; min-height: 1.2em; margin: 4px 0 12px; }
    .lock-card.unlocked { opacity: 0; transform: scale(1.06); filter: blur(10px); pointer-events: none; }

    /* 解锁后的年龄计时器面板 */
    .timer-panel {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 120;
      background: linear-gradient(135deg, rgba(60, 26, 8, 0.92), rgba(140, 70, 25, 0.92));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 215, 110, 0.35);
      box-shadow: 0 8px 30px rgba(60, 25, 5, 0.5);
      padding: 14px 18px 16px;
      text-align: center;
      opacity: 0;
      transform: translateY(-100%);
      transition: transform 1.1s cubic-bezier(0.2, 0.9, 0.3, 1.05) 0.7s, opacity 0.9s ease 0.7s;
    }
    body.timer-on .timer-panel { opacity: 1; transform: translateY(0); }
    .timer-panel .bj-time { color: var(--gold); font-weight: 800; font-size: 1.02rem; letter-spacing: 1px; }
    .timer-panel .age-line { margin-top: 6px; color: var(--cream); font-size: 0.95rem; }
    .timer-panel .age-num {
      font-variant-numeric: tabular-nums;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(255, 190, 80, 0.55);
    }
    .hidden-until-unlock { display: none; }

    body.dimmed main { filter: blur(1.5px) brightness(0.82) saturate(0.9); transition: filter 1.2s ease; }
    body.dimmed .balloons { opacity: 0.5; }

    /* 解锁成功横幅：醒目弹出提示 */
    .success-banner {
      position: fixed;
      top: 56%;
      left: 50%;
      z-index: 400;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transform: translate(-50%, -50%) scale(0.3);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.55s cubic-bezier(0.2, 1.6, 0.4, 1), opacity 0.4s ease;
    }
    .success-banner.pop { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
    .success-banner .badge {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff3c8, var(--gold) 60%, #e8952c);
      box-shadow: 0 0 0 10px rgba(255, 215, 110, 0.25), 0 0 60px rgba(255, 190, 80, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      animation: glowPulse 1.4s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 0 10px rgba(255, 215, 110, 0.25), 0 0 40px rgba(255, 190, 80, 0.7); }
      50% { box-shadow: 0 0 0 18px rgba(255, 215, 110, 0.12), 0 0 80px rgba(255, 190, 80, 1); }
    }
    .success-banner .s-title {
      margin-top: 14px;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      background: linear-gradient(90deg, #ffd76e, #ffedd0, #ffd76e);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineText 2.2s linear infinite;
      filter: drop-shadow(0 4px 20px rgba(232, 99, 44, 0.9));
    }
    .success-banner .s-sub {
      color: var(--cream);
      font-size: 1.02rem;
      background: rgba(60, 26, 8, 0.72);
      padding: 8px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 215, 110, 0.45);
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body data-title="解锁">
  <main>
    <div class="unlock-wrap">
      <div class="lock-card card" id="lock-card">
        <h1>🔐 这份心意上了锁</h1>
        <p class="tip">只有知道三个暗号的人才能打开</p>

        <div class="field">
          <label for="f-name">她的姓名</label>
          <input id="f-name" type="text" placeholder="请输入姓名" autocomplete="off" />
        </div>
        <div class="field">
          <label for="f-pass">相遇密码</label>
          <input id="f-pass" type="password" placeholder="请输入 8 位数字密码" autocomplete="off" />
        </div>
        <div class="field">
          <label for="f-bday">生日的数字</label>
          <input id="f-bday" type="password" placeholder="她/他过第几个生日？（数字）" autocomplete="off" />
        </div>

        <div class="err-msg" id="err"></div>
        <button class="btn" id="unlock-btn" style="width: 100%; justify-content: center;">🔓 解锁惊喜</button>
      </div>
    </div>
  </main>

  <!-- 解锁成功横幅（含进入按钮） -->
  <div class="success-banner" id="success-banner">
    <div class="badge">🔓</div>
    <div class="s-title">解锁成功！</div>
    <div class="s-sub">💝 暗号全对，这份心意现在属于你</div>
    <button class="btn" id="enter-btn" style="margin-top: 16px; font-size: 1.1rem; padding: 14px 34px;">🎂 进入小站</button>
  </div>

  <!-- 解锁后出现的顶部年龄计时器 -->
  <div class="timer-panel hidden-until-unlock" id="timer-panel">
    <div class="bj-time" id="bj-time">北京时间 --:--:--</div>
    <div class="age-line">🎂 李梨来到这个世界已经 <span class="age-num" id="age-num">0.00000</span> 岁</div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const U = CONFIG.unlock;
    const inputs = [
      document.getElementById("f-name"),
      document.getElementById("f-pass"),
      document.getElementById("f-bday"),
    ];
    const err = document.getElementById("err");
    let unlocked = false;

    // 已解锁的回访者：提示直接进入
    if (localStorage.getItem("bday-unlocked") === "yes") {
      err.style.color = "var(--pink-deep)";
      err.style.fontWeight = "700";
      err.textContent = "✓ 你已解锁过啦，直接进入吧～";
      document.getElementById("unlock-btn").textContent = "🎂 进入小站";
      document.getElementById("unlock-btn").onclick = () => (location.href = "index.html");
    }

    function tryUnlock() {
      const [name, pass, bday] = inputs.map((i) => i.value.trim());
      let ok = true;
      inputs.forEach((inp, i) => {
        const val = [name, pass, bday][i];
        const expect = [U.name, U.password, U.birthday][i];
        const bad = val !== expect;
        inp.classList.toggle("wrong", bad);
        if (bad) ok = false;
      });
      if (!ok) {
        err.textContent = "唔…有暗号不对哦，再想想 🤔";
        return;
      }
      err.textContent = "";
      unlocked = true;
      doUnlock();
    }

    document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
    inputs.forEach((inp) => {
      inp.addEventListener("keydown", (e) => e.key === "Enter" && tryUnlock());
      inp.addEventListener("input", () => inp.classList.remove("wrong"));
    });

    function doUnlock() {
      // ⓪ 写入门禁标记：其他页面放行
      localStorage.setItem("bday-unlocked", "yes");

      // ① 锁卡片淡化消失
      document.getElementById("lock-card").classList.add("unlocked");

      // ② 成功横幅弹出（醒目提示）
      const banner = document.getElementById("success-banner");
      banner.style.display = "flex";
      requestAnimationFrame(() => banner.classList.add("pop"));

      // ③ 顶部计时器滑入
      document.getElementById("timer-panel").style.display = "block";
      requestAnimationFrame(() => document.body.classList.add("timer-on"));

      // ④ 页面整体淡化变暗
      setTimeout(() => document.body.classList.add("dimmed"), 300);

      SITE.confetti(240);
      startTimers();

      // 横幅里的"进入小站"按钮
      document.getElementById("enter-btn").onclick = () => {
        document.body.classList.add("page-exit");
        setTimeout(() => (location.href = "index.html"), 300);
      };
    }

    /* ---- 北京时间 + 精确年龄计时器 ---- */
    function startTimers() {
      const bjTime = document.getElementById("bj-time");
      const ageNum = document.getElementById("age-num");
      const birth = new Date(CONFIG.birthDateTime.replace(" ", "T")); // 本机时区解释为北京时间含义

      function tick() {
        const now = new Date();
        // 北京时间 = UTC + 8 小时
        const bj = new Date(now.getTime() + (8 * 60 + now.getTimezoneOffset()) * 60000);
        const pad = (n) => String(n).padStart(2, "0");
        bjTime.textContent =
          `北京时间 ${bj.getFullYear()}-${pad(bj.getMonth() + 1)}-${pad(bj.getDate())} ` +
          `${pad(bj.getHours())}:${pad(bj.getMinutes())}:${pad(bj.getSeconds())}`;

        // 精确年龄（岁，5 位小数）
        const ms = now - birth;
        const YEAR_MS = 365.2425 * 24 * 3600 * 1000; // 平均回归年
        const age = ms / YEAR_MS;
        ageNum.textContent = age.toFixed(5);
      }
      tick();
      setInterval(tick, 50); // 20fps 刷新，小数位滚动感
    }
  </script>
</body>
</html>
